# Final public workflow: previews must never overwrite the live origin.
name: Publish reviewed static blog

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'public-manifest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Build production HTML
        run: python3 tools/build_site.py --source site --output _site --mode production
      - name: Validate public routes and export boundaries
        run: |
          test -f _site/index.html
          test -f _site/.nojekyll
          test ! -e _site/CNAME
          python3 tools/prepare_routing.py \
            --manifest public-manifest.json \
            --site _site \
            --upstream "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            --output _validated-routing --permanent
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
